name: litverse

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - data
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      # Configuração para testar localmente via HTTP.
      NODE_ENV: development
      TRUST_PROXY: "1"
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/litverse
      FRONTEND_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - web
      - data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:

networks:
  web:
  data:
    internal: true
